[package]
name = "otium-installer"
version = "0.3.1"
edition = "2021"
description = "Installer for the OTIUM browser"
build = "build.rs"

[[bin]]
name = "otium-setup"
path = "src/main.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
winresource = "0.1.34"
